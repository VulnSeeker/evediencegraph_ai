[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidencegraph"
version = "0.1.0"
description = "Claim-level scientific QA evaluation framework"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
llm = ["openai>=1.20"]
embeddings = ["sentence-transformers>=2.5"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
evidencegraph = "evidencegraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidencegraph"]
